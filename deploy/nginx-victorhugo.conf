# Victor Hugo - nginx site config for Oracle Cloud deployment.
#
# Place this at /etc/nginx/sites-available/victorhugo and symlink into
# /etc/nginx/sites-enabled/. Reload nginx with `sudo systemctl reload nginx`.
#
# Replace `attendance.example.org` with your real domain name BEFORE running
# certbot. certbot --nginx will rewrite the listen directives for HTTPS.

upstream victorhugo_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Force HTTPS — certbot will modify this block after issuing a cert.
server {
    listen 80;
    listen [::]:80;
    server_name attendance.example.org;

    # certbot uses this path for ACME challenge files.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name attendance.example.org;

    # certbot fills in ssl_certificate / ssl_certificate_key directives.

    # ---------- security headers ----------
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # The app sets its own CSP from Helmet; nginx adds nothing extra so it
    # doesn't double up.

    # ---------- body/timeout limits ----------
    client_max_body_size 6m;          # 5 MB attachment + multipart overhead
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 75s;

    # ---------- compression ----------
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_proxied any;

    # ---------- static client bundle ----------
    root /opt/victorhugo/client/dist;
    index index.html;

    # Hashed JS/CSS bundles never collide on filename, so cache forever.
    location ~* ^/assets/.*\.(?:js|css|woff2?|ttf|otf|eot|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static assets (images, logo, manifest, favicon).
    location ~* \.(?:png|jpg|jpeg|gif|ico|webp|svg)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---------- API reverse proxy ----------
    # Everything under /api/* goes to the Node API. Cookie auth requires
    # `proxy_pass_header Set-Cookie` (default behavior) plus forwarding the
    # real client IP so express-rate-limit + trust-proxy work.
    location /api/ {
        proxy_pass http://victorhugo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- SPA fallback ----------
    # Anything that isn't a static file or an /api route serves index.html so
    # the React Router can handle deep links.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------- denylist ----------
    location ~ /\.(env|git|ht) {
        deny all;
    }
}
